name: Backtest V2

on:
  workflow_dispatch:
  push:
    branches:
      - backtest-v2-power655

env:
  PYTHONPATH: src

permissions:
  contents: read

jobs:
  backtest-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print checkout identity
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_HEAD_REF=$GITHUB_HEAD_REF"
          git rev-parse HEAD
          git status --short
      - name: Verify runner source before Python
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/machine_learning/run_backtest_v2.py')
          text = p.read_text(encoding='utf-8')
          print('run_backtest_v2.py bytes:', p.stat().st_size)
          print('contains skip for invalid rows:', 'if len(result) != 7:' in text)
          print('contains legacy invalid-row exception:', 'raise ValueError(f"Invalid Power 6/55 row:' in text)
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pandas numpy polars pytest
      - name: Run prize and leakage tests
        run: python -m pytest src/machine_learning/tests/test_backtest_v2.py -q
      - name: Run Backtest V2 benchmark
        run: python -m src.machine_learning.run_backtest_v2
      - name: Verify audit files
        run: |
          test -d artifacts/backtest_v2
          find artifacts/backtest_v2 -maxdepth 1 -type f -print
      - name: Upload Backtest V2 audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backtest-v2-audit
          path: artifacts/backtest_v2/
          if-no-files-found: error
          retention-days: 30
