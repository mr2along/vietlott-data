name: Forecast Next Power 6/55

on:
  push:
    branches:
      - "forecast/next-power655-*"
      - "forecast/fix-next-draw-*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: src

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ml]"
          pip install pandas numpy scikit-learn
      - name: Refresh latest Power 6/55 draw incrementally
        run: |
          set -euo pipefail
          max_attempts=20
          for attempt in $(seq 1 "$max_attempts"); do
            before="$(python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/power655.jsonl")
          rows = [json.loads(line) for line in p.read_text(encoding="utf-8").splitlines() if line.strip()]
          print(max((int(r["id"]) for r in rows), default=0))
          PY
          )"
            vietlott-crawl power_655 --index-from 0 --index-to 1
            after="$(python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/power655.jsonl")
          rows = [json.loads(line) for line in p.read_text(encoding="utf-8").splitlines() if line.strip()]
          print(max((int(r["id"]) for r in rows), default=0))
          PY
          )"
            echo "incremental catch-up attempt ${attempt}: ${before} -> ${after}"
            if [ "$after" -le "$before" ]; then
              break
            fi
            if [ "${attempt}" -eq "${max_attempts}" ]; then
              echo "::error::Power 6/55 did not finish incremental catch-up after ${max_attempts} draws."
              exit 1
            fi
          done
          vietlott-missing power_655 --limit 20
          tail -n 12 data/power655.jsonl
      - name: Validate and normalize Power 6/55 history
        run: python -m src.machine_learning.normalize_power655
      - name: Validate Power 6/55 freshness
        run: |
          python - <<'PY'
          import json
          from datetime import date, timedelta, datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          rows = [json.loads(line) for line in Path("data/power655.jsonl").read_text(encoding="utf-8").splitlines() if line.strip()]
          assert rows, "Power 6/55 data is empty"
          latest = max(rows, key=lambda row: (row["date"], row["id"]))
          today = datetime.now(ZoneInfo("Asia/Ho_Chi_Minh")).date()
          latest_date = date.fromisoformat(str(latest["date"]))
          assert latest_date <= today, latest
          assert latest_date >= today - timedelta(days=4), latest
          print("POWER655_FRESH_OK", latest)
          PY
      - name: Validate decay hyperparameter on historical validation
        run: python -m src.machine_learning.run_decay_validation
      - name: Generate next-draw forecast
        run: python -m src.machine_learning.forecast_next --tickets 30 --candidate-pool-size 30 --coverage-rescue-size 0 --ensemble-score-mode full_rank --max-pair-reuse 2 --max-consecutive-run 3
      - name: Audit candidate-pool challenger
        run: |
          echo "Benchmarking coverage-rescue challenger size 8 against production score-only pool"
          python -m src.machine_learning.audit_forecast_candidates --last-draws 60 --candidate-pool-size 30 --coverage-rescue-size 8 --ensemble-score-mode full_rank
      - name: Upload forecast artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-power655-forecast
          path: artifacts/forecast/next_power655.json
          if-no-files-found: error
      - name: Upload candidate coverage audit
        uses: actions/upload-artifact@v4
        with:
          name: next-power655-candidate-audit
          path: artifacts/audit/forecast_candidate_coverage.json
          if-no-files-found: error
