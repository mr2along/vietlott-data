name: Power 6/55 Production Forecast Monitor

on:
  schedule:
    # Forecast: 16:30 Asia/Ho_Chi_Minh on Tue/Thu/Sat.
    - cron: "30 9 * * 2,4,6"
    # Evaluation: 19:15 Asia/Ho_Chi_Minh on Tue/Thu/Sat.
    - cron: "15 12 * * 2,4,6"
  workflow_dispatch:
    inputs:
      task:
        description: "Production task to run manually"
        required: true
        default: forecast
        type: choice
        options:
          - forecast
          - evaluate
  pull_request:
    branches:
      - main

concurrency:
  group: power655-production-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONPATH: src
  PYTHONUNBUFFERED: "1"

jobs:
  validate:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ml]" pytest
      - name: Compile sources
        run: python -m compileall -q src
      - name: Test forecast evaluator
        run: python -m pytest src/machine_learning/tests/test_evaluate_forecast_results.py -q

  forecast:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '30 9 * * 2,4,6') || (github.event_name == 'workflow_dispatch' && github.event.inputs.task == 'forecast') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ml]"
          pip install pandas numpy scikit-learn
      - name: Refresh Power 6/55 data
        run: |
          vietlott-crawl power_655 --index-from 0 --index-to 1
          vietlott-missing power_655 --limit 20
      - name: Normalize history
        run: python -m src.machine_learning.normalize_power655
      - name: Validate decay
        run: python -m src.machine_learning.run_decay_validation
      - name: Generate 30-ticket forecast
        run: |
          python -m src.machine_learning.forecast_next \
            --tickets 30 \
            --candidate-pool-size 30 \
            --coverage-rescue-size 0 \
            --ensemble-score-mode full_rank \
            --max-pair-reuse 2 \
            --anchor-ticket-count 3
      - name: Publish forecast report
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          payload = json.load(open("artifacts/forecast/next_power655.json", encoding="utf-8"))
          print("# Power 6/55 Forecast")
          print("")
          print(f"- Target draw: **#{payload['target_draw_id']}**")
          print(f"- Target date: **{payload['target_draw_date']}** ({payload['target_draw_weekday']})")
          print(f"- Generated (UTC): **{payload['forecast_generated_at_utc']}**")
          print("")
          for name in ("PortfolioEnsemble", "UnseenPortfolioEnsemble"):
              print(f"## {name}")
              print("")
              for i, ticket in enumerate(payload["predictions"].get(name, []), start=1):
                  print(f"{i}. `{ticket}`")
              print("")
          PY
      - name: Archive forecast by target draw
        run: |
          target_id="$(python - <<'PY'
          import json
          print(json.load(open("artifacts/forecast/next_power655.json", encoding="utf-8"))["target_draw_id"])
          PY
          )"
          mkdir -p artifacts/forecast/history
          if [ -e "artifacts/forecast/history/forecast_${target_id}.json" ]; then
            echo "Forecast ${target_id} already archived; keeping original forecast."
          else
            cp artifacts/forecast/next_power655.json "artifacts/forecast/history/forecast_${target_id}.json"
          fi
      - name: Commit forecast archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/forecast/next_power655.json artifacts/forecast/history/
          if git diff --cached --quiet; then echo "No new forecast archive."; exit 0; fi
          git commit -m "chore(forecast): archive Power 6/55 forecast"
          git push
      - name: Upload forecast
        uses: actions/upload-artifact@v4
        with:
          name: power655-production-forecast
          path: artifacts/forecast/next_power655.json
          if-no-files-found: error

  evaluate:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '15 12 * * 2,4,6') || (github.event_name == 'workflow_dispatch' && github.event.inputs.task == 'evaluate') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Refresh and normalize result data
        run: |
          vietlott-crawl power_655 --index-from 0 --index-to 1
          vietlott-missing power_655 --limit 20
          python -m src.machine_learning.normalize_power655
      - name: Evaluate stored forecasts
        run: python -m src.machine_learning.evaluate_forecast_results
      - name: Publish result report to GitHub Actions Summary
        run: cat artifacts/forecast/results/forecast_results.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit evaluation report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/forecast/results/
          if git diff --cached --quiet; then echo "No evaluation changes."; exit 0; fi
          git commit -m "chore(forecast): update realized forecast results"
          git push
      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: power655-forecast-results
          path: |
            artifacts/forecast/results/forecast_results.json
            artifacts/forecast/results/forecast_results.md
          if-no-files-found: error
