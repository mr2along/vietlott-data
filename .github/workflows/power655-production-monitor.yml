name: Power 6/55 Production Forecast Monitor

on:
  schedule:
    # 06:30 Asia/Ho_Chi_Minh == 23:30 UTC on the previous calendar day.
    # Tue/Thu/Sat Vietnam therefore maps to Mon/Wed/Fri UTC.
    - cron: "30 23 * * 1,3,5"
  workflow_run:
    workflows:
      - "Crawl Vietlott Data"
    types:
      - completed
  workflow_dispatch:
  pull_request:
    branches:
      - main

concurrency:
  group: power655-production-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONPATH: src
  PYTHONUNBUFFERED: "1"

jobs:
  validate:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ml]" pytest
      - name: Compile sources
        run: python -m compileall -q src
      - name: Test forecast evaluator
        run: python -m pytest src/machine_learning/tests/test_evaluate_forecast_results.py -q

  forecast:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ml]"
          pip install pandas numpy scikit-learn
      - name: Refresh Power 6/55 data
        run: |
          vietlott-crawl power_655 --index-from 0 --index-to 1
          vietlott-missing power_655 --limit 20
      - name: Normalize history
        run: python -m src.machine_learning.normalize_power655
      - name: Validate decay
        run: python -m src.machine_learning.run_decay_validation
      - name: Generate 30-ticket forecast
        run: |
          python -m src.machine_learning.forecast_next \
            --tickets 30 \
            --candidate-pool-size 30 \
            --coverage-rescue-size 0 \
            --ensemble-score-mode full_rank \
            --max-pair-reuse 2 \
            --anchor-ticket-count 3
      - name: Publish forecast report
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          payload = json.load(open("artifacts/forecast/next_power655.json", encoding="utf-8"))
          print("# Power 6/55 Forecast")
          print("")
          print(f"- Target draw: **#{payload['target_draw_id']}**")
          print(f"- Target date: **{payload['target_draw_date']}** ({payload['target_draw_weekday']})")
          print(f"- Generated (UTC): **{payload['forecast_generated_at_utc']}**")
          print("")
          for name in ("PortfolioEnsemble", "UnseenPortfolioEnsemble"):
              print(f"## {name}")
              print("")
              for i, ticket in enumerate(payload["predictions"].get(name, []), start=1):
                  print(f"{i}. `{ticket}`")
              print("")
          PY
      - name: Archive forecast by target draw
        run: |
          target_id="$(python - <<'PY'
          import json
          print(json.load(open("artifacts/forecast/next_power655.json", encoding="utf-8"))["target_draw_id"])
          PY
          )"
          mkdir -p artifacts/forecast/history
          if [ -e "artifacts/forecast/history/forecast_${target_id}.json" ]; then
            echo "Forecast ${target_id} already archived; keeping original forecast."
          else
            cp artifacts/forecast/next_power655.json "artifacts/forecast/history/forecast_${target_id}.json"
          fi
      - name: Commit forecast archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/forecast/next_power655.json artifacts/forecast/history/
          if git diff --cached --quiet; then echo "No new forecast archive."; exit 0; fi
          git commit -m "chore(forecast): archive Power 6/55 forecast"
          git push
      - name: Upload forecast
        uses: actions/upload-artifact@v4
        with:
          name: power655-production-forecast
          path: artifacts/forecast/next_power655.json
          if-no-files-found: error

  evaluate:
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Refresh and normalize result data
        run: |
          vietlott-crawl power_655 --index-from 0 --index-to 1
          vietlott-missing power_655 --limit 20
          python -m src.machine_learning.normalize_power655
      - name: Evaluate stored forecasts
        run: python -m src.machine_learning.evaluate_forecast_results
      - name: Publish result report
        run: cat artifacts/forecast/results/forecast_results.md >> "$GITHUB_STEP_SUMMARY"
      - name: Check email configuration
        id: email_config
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
        run: |
          if [ -n "$SMTP_USERNAME" ] && [ -n "$SMTP_PASSWORD" ] && [ -n "$SMTP_SERVER" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "SMTP email reporting is configured."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "SMTP email reporting is not configured; skipping email."
          fi
      - name: Send result report by email
        if: steps.email_config.outputs.enabled == 'true'
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT || 465 }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Vietlott Power 6/55 - Forecast Result Report"
          to: "Nhutminh50ctu@gmail.com"
          from: ${{ secrets.SMTP_FROM || secrets.SMTP_USERNAME }}
          secure: true
          body: |
            Power 6/55 Forecast Result Report

            Repository: mr2along/vietlott-data

            The detailed evaluation report is attached.
          html_body: |
            <h2>Power 6/55 Forecast Result Report</h2>
            <p>Repository: <b>mr2along/vietlott-data</b></p>
            <p>The detailed evaluation report is attached.</p>
          attachments: artifacts/forecast/results/forecast_results.md,artifacts/forecast/results/forecast_results.json
      - name: Commit evaluation report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/forecast/results/
          if git diff --cached --quiet; then echo "No evaluation changes."; exit 0; fi
          git commit -m "chore(forecast): update realized forecast results"
          git push
      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: power655-forecast-results
          path: |
            artifacts/forecast/results/forecast_results.json
            artifacts/forecast/results/forecast_results.md
          if-no-files-found: error
