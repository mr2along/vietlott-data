name: Power 6/55 Production Forecast Monitor

on:
  schedule:
    # Precompute: 20:30 Asia/Ho_Chi_Minh on Mon/Wed/Fri.
    # Runs after the previous draw and removes the 06:30 forecast dependency.
    - cron: "30 13 * * 1,3,5"
    # Verify/fallback: 06:30 Asia/Ho_Chi_Minh on Tue/Thu/Sat.
    # Verifies the precomputed forecast and regenerates only when necessary.
    - cron: "30 23 * * 1,3,5"
    # Evaluation: 19:15 Asia/Ho_Chi_Minh on Tue/Thu/Sat.
    - cron: "15 12 * * 2,4,6"
  workflow_dispatch:
    inputs:
      task:
        description: "Production task to run manually"
        required: true
        default: precompute
        type: choice
        options:
          - precompute
          - verify
          - evaluate
  pull_request:
    branches:
      - main

concurrency:
  group: power655-main-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONPATH: src
  PYTHONUNBUFFERED: "1"

jobs:
  validate:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ml]" pytest
      - name: Compile sources
        run: python -m compileall -q src
      - name: Run unit and data tests
        run: python -m pytest src/vietlott/tests src/machine_learning/tests -q

  precompute:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '30 13 * * 1,3,5') || (github.event_name == 'workflow_dispatch' && github.event.inputs.task == 'precompute') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ml]"
          pip install pandas numpy scikit-learn
      - name: Refresh Power 6/55 data incrementally
        run: |
          set -euo pipefail
          max_attempts=20
          for attempt in $(seq 1 "$max_attempts"); do
            before="$(python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/power655.jsonl")
          rows = [json.loads(line) for line in p.read_text(encoding="utf-8").splitlines() if line.strip()]
          print(max((int(r["id"]) for r in rows), default=0))
          PY
          )"
            vietlott-crawl power_655 --index-from 0 --index-to 1
            after="$(python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/power655.jsonl")
          rows = [json.loads(line) for line in p.read_text(encoding="utf-8").splitlines() if line.strip()]
          print(max((int(r["id"]) for r in rows), default=0))
          PY
          )"
            echo "incremental catch-up attempt ${attempt}: ${before} -> ${after}"
            if [ "$after" -le "$before" ]; then
              break
            fi
            if [ "${attempt}" -eq "${max_attempts}" ]; then
              echo "::error::Power 6/55 did not finish incremental catch-up after ${max_attempts} draws."
              exit 1
            fi
          done
          vietlott-missing power_655 --limit 20
      - name: Normalize history
        run: python -m src.machine_learning.normalize_power655
      - name: Validate Power 6/55 freshness
        run: |
          python - <<'PY'
          import json
          from datetime import date, timedelta, datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          rows = [json.loads(line) for line in Path("data/power655.jsonl").read_text(encoding="utf-8").splitlines() if line.strip()]
          assert rows, "Power 6/55 data is empty"
          latest = max(rows, key=lambda row: (row["date"], row["id"]))
          today = datetime.now(ZoneInfo("Asia/Ho_Chi_Minh")).date()
          latest_date = date.fromisoformat(str(latest["date"]))
          assert latest_date <= today, latest
          assert latest_date >= today - timedelta(days=4), latest
          print("POWER655_FRESH_OK", latest)
          PY
      - name: Validate decay
        run: python -m src.machine_learning.run_decay_validation
      - name: Generate 30-ticket forecast
        run: |
          python -m src.machine_learning.forecast_next \
            --tickets 30 \
            --candidate-pool-size 30 \
            --coverage-rescue-size 0 \
            --ensemble-score-mode full_rank \
            --max-pair-reuse 2 --max-consecutive-run 3 \
            --anchor-ticket-count 3
      - name: Validate generated forecast
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = [json.loads(x) for x in Path("data/power655.jsonl").read_text(encoding="utf-8").splitlines() if x.strip()]
          payload = json.loads(Path("artifacts/forecast/next_power655.json").read_text(encoding="utf-8"))
          latest_id = max(int(row["id"]) for row in data)
          target_id = int(payload["target_draw_id"])
          assert target_id == latest_id + 1, (latest_id, target_id)
          assert payload.get("predictions", {}).get("PortfolioEnsemble"), "PortfolioEnsemble forecast missing"
          assert payload.get("predictions", {}).get("UnseenPortfolioEnsemble"), "UnseenPortfolioEnsemble forecast missing"
          print(f"FORECAST_TARGET_OK=#{target_id} latest_data=#{latest_id}")
          PY
      - name: Publish forecast report
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          payload = json.load(open("artifacts/forecast/next_power655.json", encoding="utf-8"))
          print("# Power 6/55 Forecast")
          print("")
          print(f"- Target draw: **#{payload['target_draw_id']}**")
          print(f"- Target date: **{payload['target_draw_date']}** ({payload['target_draw_weekday']})")
          print(f"- Generated (UTC): **{payload['forecast_generated_at_utc']}**")
          print("")
          for name in ("PortfolioEnsemble", "UnseenPortfolioEnsemble"):
              print(f"## {name}")
              print("")
              for i, ticket in enumerate(payload["predictions"].get(name, []), start=1):
                  print(f"{i}. `{ticket}`")
              print("")
          PY
      - name: Archive forecast by target draw
        run: |
          target_id="$(python - <<'PY'
          import json
          print(json.load(open("artifacts/forecast/next_power655.json", encoding="utf-8"))["target_draw_id"])
          PY
          )"
          mkdir -p artifacts/forecast/history
          if [ -e "artifacts/forecast/history/forecast_${target_id}.json" ]; then
            echo "Forecast ${target_id} already archived; keeping original forecast."
          else
            cp artifacts/forecast/next_power655.json "artifacts/forecast/history/forecast_${target_id}.json"
          fi
      - name: Commit data and forecast archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/power655.jsonl artifacts/forecast/next_power655.json artifacts/forecast/history/
          if git diff --cached --quiet; then echo "No new forecast archive."; exit 0; fi
          git commit -m "chore(forecast): precompute Power 6/55 production forecast"
          git push
      - name: Upload precomputed forecast
        uses: actions/upload-artifact@v4
        with:
          name: power655-production-forecast-precomputed
          path: artifacts/forecast/next_power655.json
          if-no-files-found: error


  verify:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '30 23 * * 1,3,5') || (github.event_name == 'workflow_dispatch' && github.event.inputs.task == 'verify') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ml]"
          pip install pandas numpy scikit-learn
      - name: Refresh Power 6/55 data incrementally
        run: |
          set -euo pipefail
          max_attempts=20
          for attempt in $(seq 1 "$max_attempts"); do
            before="$(python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/power655.jsonl")
          rows = [json.loads(line) for line in p.read_text(encoding="utf-8").splitlines() if line.strip()]
          print(max((int(r["id"]) for r in rows), default=0))
          PY
          )"
            vietlott-crawl power_655 --index-from 0 --index-to 1
            after="$(python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/power655.jsonl")
          rows = [json.loads(line) for line in p.read_text(encoding="utf-8").splitlines() if line.strip()]
          print(max((int(r["id"]) for r in rows), default=0))
          PY
          )"
            echo "verification refresh attempt ${attempt}: ${before} -> ${after}"
            if [ "${after}" -le "${before}" ]; then
              break
            fi
            if [ "${attempt}" -eq "${max_attempts}" ]; then
              echo "::error::Power 6/55 did not finish incremental catch-up after ${max_attempts} draws."
              exit 1
            fi
          done
          vietlott-missing power_655 --limit 20
          python -m src.machine_learning.normalize_power655
      - name: Validate Power 6/55 freshness
        run: |
          python - <<'PY'
          import json
          from datetime import date, timedelta, datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          rows = [json.loads(line) for line in Path("data/power655.jsonl").read_text(encoding="utf-8").splitlines() if line.strip()]
          assert rows, "Power 6/55 data is empty"
          latest = max(rows, key=lambda row: (row["date"], row["id"]))
          today = datetime.now(ZoneInfo("Asia/Ho_Chi_Minh")).date()
          latest_date = date.fromisoformat(str(latest["date"]))
          assert latest_date <= today, latest
          assert latest_date >= today - timedelta(days=4), latest
          print("POWER655_FRESH_OK", latest)
          PY
      - name: Verify precomputed forecast
        id: verify_forecast
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/forecast/next_power655.json")
          if not path.exists():
              raise SystemExit("FORECAST_MISSING")

          data = [json.loads(x) for x in Path("data/power655.jsonl").read_text(encoding="utf-8").splitlines() if x.strip()]
          payload = json.loads(path.read_text(encoding="utf-8"))
          latest_id = max(int(row["id"]) for row in data)
          target_id = int(payload["target_draw_id"])
          if target_id != latest_id + 1:
              raise SystemExit(f"FORECAST_TARGET_STALE latest=#{latest_id} target=#{target_id}")
          for name in ("PortfolioEnsemble", "UnseenPortfolioEnsemble"):
              if not payload.get("predictions", {}).get(name):
                  raise SystemExit(f"FORECAST_SECTION_MISSING {name}")
          print(f"FORECAST_READY target=#{target_id} latest_data=#{latest_id}")
          PY
      - name: Regenerate forecast fallback
        if: ${{ steps.verify_forecast.outcome != 'success' }}
        run: |
          echo "Precomputed forecast is missing or stale; running production fallback."
          python -m src.machine_learning.run_decay_validation
          python -m src.machine_learning.forecast_next             --tickets 30             --candidate-pool-size 30             --coverage-rescue-size 0             --ensemble-score-mode full_rank             --max-pair-reuse 2 --max-consecutive-run 3             --anchor-ticket-count 3
      - name: Final forecast target check
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = [json.loads(x) for x in Path("data/power655.jsonl").read_text(encoding="utf-8").splitlines() if x.strip()]
          payload = json.loads(Path("artifacts/forecast/next_power655.json").read_text(encoding="utf-8"))
          latest_id = max(int(row["id"]) for row in data)
          target_id = int(payload["target_draw_id"])
          assert target_id == latest_id + 1, (latest_id, target_id)
          assert payload.get("predictions", {}).get("PortfolioEnsemble"), "PortfolioEnsemble forecast missing"
          assert payload.get("predictions", {}).get("UnseenPortfolioEnsemble"), "UnseenPortfolioEnsemble forecast missing"
          print(f"FORECAST_READY target=#{target_id} latest_data=#{latest_id}")
          PY
      - name: Publish forecast report
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          payload = json.load(open("artifacts/forecast/next_power655.json", encoding="utf-8"))
          print("# Power 6/55 Forecast — Verified")
          print("")
          print(f"- Target draw: **#{payload['target_draw_id']}**")
          print(f"- Target date: **{payload['target_draw_date']}** ({payload['target_draw_weekday']})")
          print(f"- Generated (UTC): **{payload['forecast_generated_at_utc']}**")
          PY
      - name: Archive forecast by target draw
        run: |
          target_id="$(python - <<'PY'
          import json
          print(json.load(open("artifacts/forecast/next_power655.json", encoding="utf-8"))["target_draw_id"])
          PY
          )"
          mkdir -p artifacts/forecast/history
          if [ -e "artifacts/forecast/history/forecast_${target_id}.json" ]; then
            echo "Forecast ${target_id} already archived; keeping original forecast."
          else
            cp artifacts/forecast/next_power655.json "artifacts/forecast/history/forecast_${target_id}.json"
          fi
      - name: Commit verification refresh and fallback forecast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/power655.jsonl artifacts/forecast/next_power655.json artifacts/forecast/history/
          if git diff --cached --quiet; then echo "Verification passed; no changes to commit."; exit 0; fi
          git commit -m "chore(forecast): verify Power 6/55 production forecast"
          git push
      - name: Upload verified forecast
        uses: actions/upload-artifact@v4
        with:
          name: power655-production-forecast-verified
          path: artifacts/forecast/next_power655.json
          if-no-files-found: error

  evaluate:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '15 12 * * 2,4,6') || (github.event_name == 'workflow_dispatch' && github.event.inputs.task == 'evaluate') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Refresh and normalize result data incrementally
        run: |
          set -euo pipefail
          max_attempts=20
          for attempt in $(seq 1 "$max_attempts"); do
            before="$(python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/power655.jsonl")
          rows = [json.loads(line) for line in p.read_text(encoding="utf-8").splitlines() if line.strip()]
          print(max((int(r["id"]) for r in rows), default=0))
          PY
          )"
            vietlott-crawl power_655 --index-from 0 --index-to 1
            after="$(python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/power655.jsonl")
          rows = [json.loads(line) for line in p.read_text(encoding="utf-8").splitlines() if line.strip()]
          print(max((int(r["id"]) for r in rows), default=0))
          PY
          )"
            echo "incremental catch-up attempt ${attempt}: ${before} -> ${after}"
            if [ "$after" -le "$before" ]; then
              break
            fi
            if [ "${attempt}" -eq "${max_attempts}" ]; then
              echo "::error::Power 6/55 did not finish incremental catch-up after ${max_attempts} draws."
              exit 1
            fi
          done
          vietlott-missing power_655 --limit 20
          python -m src.machine_learning.normalize_power655
      - name: Validate Power 6/55 freshness
        run: |
          python - <<'PY'
          import json
          from datetime import date, timedelta, datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          rows = [json.loads(line) for line in Path("data/power655.jsonl").read_text(encoding="utf-8").splitlines() if line.strip()]
          assert rows, "Power 6/55 data is empty"
          latest = max(rows, key=lambda row: (row["date"], row["id"]))
          today = datetime.now(ZoneInfo("Asia/Ho_Chi_Minh")).date()
          latest_date = date.fromisoformat(str(latest["date"]))
          assert latest_date <= today, latest
          assert latest_date >= today - timedelta(days=4), latest
          print("POWER655_FRESH_OK", latest)
          PY
      - name: Evaluate stored forecasts
        run: python -m src.machine_learning.evaluate_forecast_results
      - name: Publish result report to GitHub Actions Summary
        run: cat artifacts/forecast/results/forecast_results.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit evaluation report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/forecast/results/
          if git diff --cached --quiet; then echo "No evaluation changes."; exit 0; fi
          git commit -m "chore(forecast): update realized forecast results"
          git push
      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: power655-forecast-results
          path: |
            artifacts/forecast/results/forecast_results.json
            artifacts/forecast/results/forecast_results.md
          if-no-files-found: error
