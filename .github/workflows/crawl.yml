name: Crawl Vietlott Data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * *"

permissions:
  contents: write

concurrency:
  group: crawl-main
  cancel-in-progress: false

env:
  PYTHONPATH: src

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Crawl Power 6/55
        run: |
          vietlott-crawl power_655 --index-from 0 --index-to 1
      - name: Backfill missing Power 6/55 draws
        run: |
          vietlott-missing power_655 --limit 20
      - name: Validate Power 6/55 freshness
        run: |
          python - <<'PY'
          import json
          from datetime import date, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from datetime import datetime

          rows = [json.loads(line) for line in Path("data/power655.jsonl").read_text().splitlines() if line.strip()]
          assert rows, "Power 6/55 crawler returned no rows"
          latest = max(rows, key=lambda row: (row["date"], row["id"]))
          today = datetime.now(ZoneInfo("Asia/Ho_Chi_Minh")).date()
          latest_date = date.fromisoformat(str(latest["date"]))
          assert latest_date <= today, latest
          assert latest_date >= today - timedelta(days=4), latest
          assert len(latest["result"]) == 7, latest
          assert len(set(latest["result"][:6])) == 6, latest
          assert latest["result"][6] not in latest["result"][:6], latest
          print("POWER655_FRESH_OK", latest)
          PY
      - name: Crawl remaining products
        run: |
          vietlott-crawl power_645 --index-from 0 --index-to 1
          vietlott-crawl power_535 --index-from 0 --index-to 1
          vietlott-crawl 3d --index-from 0 --index-to 1
          vietlott-crawl 3d_pro --index-from 0 --index-to 1
          vietlott-crawl bingo18 --index-from 0 --index-to 1
          vietlott-crawl keno --index-from 0 --index-to 24
      - name: Regenerate documentation
        run: |
          python src/render_readme.py
          python src/render_docs.py
      - name: Validate Power 6/55 data
        run: python -m src.machine_learning.normalize_power655
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data README.md docs/index.html src/machine_learning/README.md artifacts/backtest_v2/power655_benchmark.jsonl artifacts/backtest_v2/power655_incomplete.jsonl artifacts/backtest_v2/data_validation.json || true
          if git diff --cached --quiet; then echo "No data changes."; exit 0; fi
          git commit -m "chore(data): update Vietlott data"
          git push
