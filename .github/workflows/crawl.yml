name: Crawl Vietlott Data

on:
  workflow_dispatch:
  schedule:
    - cron: "45 22 * * *"

permissions:
  contents: write

concurrency:
  group: power655-main-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONPATH: src

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Crawl Power 6/55 incrementally
        run: |
          set -euo pipefail
          max_attempts=20
          for attempt in $(seq 1 "$max_attempts"); do
            before="$(python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/power655.jsonl")
          if not p.exists():
              print(0)
          else:
              rows = [json.loads(line) for line in p.read_text(encoding="utf-8").splitlines() if line.strip()]
              print(max((int(r["id"]) for r in rows), default=0))
          PY
          )"
            vietlott-crawl power_655 --index-from 0 --index-to 1
            after="$(python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/power655.jsonl")
          rows = [json.loads(line) for line in p.read_text(encoding="utf-8").splitlines() if line.strip()]
          print(max((int(r["id"]) for r in rows), default=0))
          PY
          )"
            echo "incremental catch-up attempt ${attempt}: ${before} -> ${after}"
            if [ "$after" -le "$before" ]; then
              break
            fi
            if [ "${attempt}" -eq "${max_attempts}" ]; then
              echo "::error::Power 6/55 did not finish incremental catch-up after ${max_attempts} draws."
              exit 1
            fi
          done
      - name: Backfill missing Power 6/55 draws
        run: |
          vietlott-missing power_655 --limit 20
      - name: Validate Power 6/55 freshness
        run: |
          python - <<'PY'
          import json
          from datetime import date, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from datetime import datetime

          rows = [json.loads(line) for line in Path("data/power655.jsonl").read_text().splitlines() if line.strip()]
          assert rows, "Power 6/55 crawler returned no rows"
          latest = max(rows, key=lambda row: (row["date"], row["id"]))
          today = datetime.now(ZoneInfo("Asia/Ho_Chi_Minh")).date()
          latest_date = date.fromisoformat(str(latest["date"]))
          assert latest_date <= today, latest
          assert latest_date >= today - timedelta(days=4), latest
          assert len(latest["result"]) == 7, latest
          assert len(set(latest["result"][:6])) == 6, latest
          assert latest["result"][6] not in latest["result"][:6], latest
          print("POWER655_FRESH_OK", latest)
          PY
      - name: Crawl remaining products (non-blocking)
        continue-on-error: true
        run: |
          set +e
          for product_args in \
            "power_645 --index-from 0 --index-to 1" \
            "power_535 --index-from 0 --index-to 1" \
            "3d --index-from 0 --index-to 1" \
            "3d_pro --index-from 0 --index-to 1" \
            "bingo18 --index-from 0 --index-to 1" \
            "keno --index-from 0 --index-to 24"
          do
            echo "=== Crawling $product_args ==="
            vietlott-crawl $product_args
            rc=$?
            if [ $rc -ne 0 ]; then
              echo "::warning::Optional product crawl failed (exit $rc): $product_args"
            fi
          done
          echo "Power 6/55 pipeline remains authoritative; optional product failures do not block downstream Power 6/55 evaluation."
      - name: Regenerate documentation
        run: |
          python src/render_readme.py
          python src/render_docs.py
      - name: Validate Power 6/55 data
        # Run as a script so normalization remains independent of optional ML packages.
        run: python src/machine_learning/normalize_power655.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data README.md docs/index.html src/machine_learning/README.md artifacts/backtest_v2/power655_benchmark.jsonl artifacts/backtest_v2/power655_incomplete.jsonl artifacts/backtest_v2/data_validation.json || true
          if git diff --cached --quiet; then echo "No data changes."; exit 0; fi
          git commit -m "chore(data): update Vietlott data"
          git push
